<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tasks</title>
<style>
  body { margin: 0; font-family: Helvetica, Arial, sans-serif; background: #f4f5f7; color: #1d2330; }
  main { max-width: 420px; margin: 32px auto; padding: 0 16px; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  .card-list { display: flex; flex-direction: column; gap: 8px; }
  .card { background: #fff; border: 1px solid #d5d9e0; border-radius: 8px; padding: 2px 16px; }
  .card h2 { font-size: 16px; margin: 0; }
  .card p { font-size: 14px; margin: 2px 0 0; color: #5a6272; }
</style>
</head>
<body>
<main>
  <h1>Tasks</h1>
  <section class="card-list" id="card-list">
    <article class="card"><h2>Write release notes</h2><p>Due Friday</p></article>
    <article class="card"><h2>Review the onboarding copy</h2><p>Due Monday</p></article>
    <article class="card"><h2>Plan the team offsite</h2><p>Due next month</p></article>
  </section>
</main>
</body>
</html>
